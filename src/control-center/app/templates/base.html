<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <title>{% block title %}LiveFire Control Center{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}" {% block body_data %}{% endblock %}>
  <header class="topbar">
    <a class="brand" href="/">LiveFire <span>Control Center</span></a>
    {% if user and auth_mode == "passcode" %}
    <form class="signout" method="post" action="/logout">
      <span class="who">{{ user.name }}</span>
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="link">Sign out</button>
    </form>
    {% elif user %}
    <span class="who">{{ user.name }}</span>
    {% endif %}
  </header>
  <main>
  {% block content %}{% endblock %}
  </main>
</body>
</html>
