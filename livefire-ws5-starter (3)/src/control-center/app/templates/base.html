<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <title>{% block title %}LiveFire Fusion Control Center{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">LiveFire Fusion <span>Control Center</span></a>
    {% if user %}
    <form method="post" action="/logout" class="who">
      <span>{{ user.name }}</span>
      <input type="hidden" name="csrf" value="{{ csrf }}">
      {% if user.method == 'passcode' %}<button type="submit" class="link">Sign out</button>{% endif %}
    </form>
    {% endif %}
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
