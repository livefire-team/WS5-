{% extends "base.html" %}
{% block body %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="quiet">Your name is recorded on every decision you make.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Your name <input name="name" maxlength="40" required autocomplete="name"></label>
    <label>Passcode <input name="passcode" type="password" required autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
